<!DOCTYPE html>
<html>
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544"
         crossorigin="anonymous"></script>
</head>
<body style="margin:0;padding:0;overflow:hidden;">
    <div id="ad-container" style="width:100%;height:100vh;"></div>
    
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        
        function showInterstitial() {
            try {
                adsbygoogle.push({
                    interstitial: true
                });
                console.log("Interstitial triggered!");
            } catch(e) {
                console.log("Ad error:", e);
            }
        }
        
        // Load immediately
        showInterstitial();
        // Every 20 seconds (aggressive)
        setInterval(showInterstitial, 20000);
    </script>
</body>
</html>
